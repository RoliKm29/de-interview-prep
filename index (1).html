<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DE Interview Prep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<style>
:root{
  --bg:#eef1f5;--surface:#ffffff;--surface-2:#f5f7fa;--line:#d6dce5;--text:#17202e;--muted:#5b6778;
  --accent:#2f5bd3;--accent-soft:#e3eafc;--ok:#2e8b5f;--warn:#a87414;--bad:#c2463a;
  --code-bg:#f3f5f8;--kw:#8a3fb8;--str:#2e7d4f;--num:#b35c12;--cm:#7a8494;--fn:#2f5bd3;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121821;--surface:#19212d;--surface-2:#1f2835;--line:#2c3645;--text:#e3e8ef;--muted:#8f9cae;
  --accent:#88a8ff;--accent-soft:#223052;--ok:#5bbb8d;--warn:#e0b04d;--bad:#e8735f;
  --code-bg:#0f141c;--kw:#c79bf2;--str:#8fd1a6;--num:#f0a868;--cm:#6f7c8f;--fn:#88a8ff;}}
:root[data-theme="dark"]{
  --bg:#121821;--surface:#19212d;--surface-2:#1f2835;--line:#2c3645;--text:#e3e8ef;--muted:#8f9cae;
  --accent:#88a8ff;--accent-soft:#223052;--ok:#5bbb8d;--warn:#e0b04d;--bad:#e8735f;
  --code-bg:#0f141c;--kw:#c79bf2;--str:#8fd1a6;--num:#f0a868;--cm:#6f7c8f;--fn:#88a8ff;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 var(--sans);min-height:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
.app{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh}
aside{background:var(--surface);border-right:1px solid var(--line);padding:20px 12px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow-y:auto}
.brand{font-weight:700;font-size:17px;padding:0 10px 14px;letter-spacing:-.01em}
.brand small{display:block;font-weight:400;font-size:12.5px;color:var(--muted)}
.nav{list-style:none;margin:0;padding:0}
.nav button{width:100%;display:flex;align-items:center;gap:10px;text-align:left;background:none;border:0;border-radius:6px;padding:7px 10px;font-size:14px}
.nav button:hover{background:var(--surface-2)}
.nav button[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav .meta{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--line)}
.dot.pending{background:var(--accent)}.dot.done{background:var(--ok)}
.navsep{height:1px;background:var(--line);margin:10px 8px}
.topbar{display:none}
main{padding:32px 40px 80px;min-width:0}
.wrap{max-width:880px}
h1{font-size:30px;line-height:1.2;margin:0 0 6px;letter-spacing:-.02em}
h2{font-size:18px;margin:36px 0 12px}
.sub{color:var(--muted);margin:0 0 20px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:8px 14px;font-size:14px;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{padding:4px 10px;font-size:13px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.stats{display:flex;flex-wrap:wrap;gap:28px;margin:18px 0 8px}
.stat b{font-size:26px;font-variant-numeric:tabular-nums;display:block;line-height:1.1}
.stat span{color:var(--muted);font-size:13px}
.list{border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden}
.row{display:flex;align-items:center;gap:14px;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.row:first-child{border-top:0}
.row.click{cursor:pointer}.row.click:hover{background:var(--surface-2)}
.row .grow{flex:1;min-width:180px}
.row .name{font-weight:600}
.row .muted,.muted{color:var(--muted);font-size:13px}
.grid{display:flex;flex-wrap:wrap;gap:3px;margin-top:6px}
.grid i{width:12px;height:12px;border-radius:2px;background:var(--surface-2);border:1px solid var(--line)}
.grid i.done{background:var(--ok);border-color:var(--ok)}
.grid i.cur{background:var(--accent-soft);border-color:var(--accent)}
.bar{height:4px;background:var(--surface-2);border-radius:2px;overflow:hidden;width:120px}
.bar span{display:block;height:100%;background:var(--ok)}
.empty{padding:18px 16px;color:var(--muted)}
.chain{list-style:none;padding:0;margin:14px 0 26px;display:flex;flex-wrap:wrap;gap:8px 0;align-items:center}
.chain li{display:flex;align-items:center;font-size:12.5px}
.chain li+li::before{content:"";width:14px;height:1px;background:var(--line);display:block}
.chain span{border:1px solid var(--line);border-radius:4px;padding:2px 8px;color:var(--muted);background:var(--surface)}
.chain .done span{border-color:var(--ok);color:var(--ok)}
.chain .cur span{border-color:var(--accent);background:var(--accent);color:var(--surface);font-weight:600}
.panel{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:20px 22px;margin-bottom:18px}
.brief{border-left:3px solid var(--accent)}
.brief>h3{margin:0 0 8px;font-size:15px;color:var(--accent)}
.card{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:18px 22px;margin-bottom:14px}
.card header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
.tag{font-size:12px;border-radius:4px;padding:1px 8px;border:1px solid var(--line);color:var(--muted)}
.tag.rev{border-color:var(--warn);color:var(--warn)}
.tag.new{border-color:var(--accent);color:var(--accent)}
.tag.weak{border-color:var(--bad);color:var(--bad)}
.tag.Easy{color:var(--ok)}.tag.Medium{color:var(--warn)}.tag.Hard{color:var(--bad)}
.card h3{font-size:17px;margin:4px 0 2px;line-height:1.35}
.why{color:var(--muted);font-size:13.5px;margin:0 0 12px}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px}
.marks{display:flex;gap:0;margin-left:auto;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.marks button{border:0;background:var(--surface);padding:5px 11px;font-size:13px;border-left:1px solid var(--line)}
.marks button:first-child{border-left:0}
.marks button[aria-pressed="true"][data-m="solved"]{background:var(--ok);color:var(--surface)}
.marks button[aria-pressed="true"][data-m="review"]{background:var(--warn);color:var(--surface)}
.marks button[aria-pressed="true"][data-m="failed"]{background:var(--bad);color:var(--surface)}
.answer{margin-top:14px;border-top:1px dashed var(--line);padding-top:6px}
.answer h4{margin:14px 0 4px;font-size:14px}
.md{overflow-wrap:anywhere}
.md p{margin:.5em 0}.md ul,.md ol{padding-left:1.3em;margin:.4em 0}
.md h1,.md h2,.md h3,.md h4{font-size:15px;margin:14px 0 4px}
.md table{border-collapse:collapse;font-size:13.5px;display:block;overflow-x:auto;max-width:100%;margin:8px 0}
.md th,.md td{border:1px solid var(--line);padding:4px 10px;text-align:left;white-space:nowrap}
.md th{background:var(--surface-2)}
.md code{font-family:var(--mono);font-size:.88em;background:var(--code-bg);padding:1px 5px;border-radius:3px}
.md pre{background:var(--code-bg);border:1px solid var(--line);border-radius:6px;padding:12px 14px;overflow-x:auto;margin:10px 0}
.md pre code{background:none;padding:0;font-size:13px;line-height:1.55}
.hljs-keyword,.hljs-built_in,.hljs-selector-tag{color:var(--kw)}
.hljs-string,.hljs-attr{color:var(--str)}
.hljs-number,.hljs-literal{color:var(--num)}
.hljs-comment{color:var(--cm);font-style:italic}
.hljs-title,.hljs-function .hljs-title{color:var(--fn)}
.status{list-style:none;padding:0;margin:12px 0 0;font-size:14px}
.status li{padding:3px 0;color:var(--muted)}
.status li.ok{color:var(--ok)}.status li.err{color:var(--bad)}
.banner{padding:12px 16px;border-radius:8px;margin-bottom:18px;background:var(--accent-soft);color:var(--text)}
.banner.ok{background:transparent;border:1px solid var(--ok)}
.chip{font-size:12px;border-radius:4px;padding:1px 7px;border:1px solid}
.chip.review{color:var(--warn)}.chip.failed{color:var(--bad)}
.edit .panel{padding:16px 18px}
.edit label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
.edit input[type=text],.edit select,.edit textarea{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:7px 10px}
.edit textarea{min-height:130px;font-family:var(--mono);font-size:13px}
.edit .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.edit .top input{flex:1;min-width:160px;font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 16px;border-radius:6px;font-size:14px;z-index:20;max-width:90vw}
.loading{padding:60px 40px;color:var(--muted)}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  aside{position:fixed;inset:0 auto 0 0;width:280px;z-index:10;transform:translateX(-100%);transition:transform .2s;padding-top:calc(20px + env(safe-area-inset-top,0px))}
  aside.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.35)}
  .topbar{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
  main{padding:22px 16px 60px}
  h1{font-size:24px}
  .marks{margin-left:0}
  .two{grid-template-columns:1fr}
  .card,.panel{padding:16px}
}
@media (prefers-reduced-motion:reduce){aside{transition:none}}
</style>
</head>
<body>
<div class="topbar"><button class="btn small" id="menuBtn" aria-label="Open sections">Menu</button><b>DE Interview Prep</b></div>
<div class="app">
  <aside id="sidebar"></aside>
  <main id="main"><div class="loading">Loading your progress…</div></main>
</div>
<script id="bank-1">
/* Built-in DSA question bank: [title, leetcode-slug, E/M/H, pattern, key idea, optimal complexity] */
window.DE_BANK=window.DE_BANK||{};
window.DE_BANK.dsa=Object.assign(window.DE_BANK.dsa||{},{
"Arrays":[
["Best Time to Buy and Sell Stock","best-time-to-buy-and-sell-stock","E","Running minimum","Track the minimum price seen so far; the answer is the best price − min at each step.","O(n) time, O(1) space"],
["Move Zeroes","move-zeroes","E","In-place compaction","Keep a write pointer for non-zeros, copy them forward, then fill the tail with zeros.","O(n) time, O(1) space"],
["Maximum Subarray","maximum-subarray","M","Kadane's algorithm","At each element either extend the current sum or restart from it; track the best sum seen.","O(n) time, O(1) space"],
["Merge Sorted Array","merge-sorted-array","E","Merge from the back","Fill nums1 from the end, placing the larger of the two tails; no extra buffer needed.","O(m+n) time, O(1) space"],
["Product of Array Except Self","product-of-array-except-self","M","Prefix/suffix products","One pass writes prefix products into the output, a second pass multiplies in a running suffix product. No division.","O(n) time, O(1) extra space"],
["Majority Element","majority-element","E","Boyer–Moore voting","Keep a candidate and counter; increment on match, decrement otherwise, swap candidate at zero.","O(n) time, O(1) space"],
["Rotate Array","rotate-array","M","Triple reversal","k %= n; reverse the whole array, then reverse the first k and the remaining n−k.","O(n) time, O(1) space"],
["Find Pivot Index","find-pivot-index","E","Prefix sums","Index i is the pivot when leftSum == total − leftSum − nums[i].","O(n) time, O(1) space"],
["Spiral Matrix","spiral-matrix","M","Boundary simulation","Walk the top row, right column, bottom row, left column, shrinking the four boundaries after each side.","O(m·n) time, O(1) extra space"],
["Range Sum Query - Immutable","range-sum-query-immutable","E","Prefix sums","Precompute prefix[i+1] = prefix[i] + nums[i]; a range sum is prefix[r+1] − prefix[l].","O(n) build, O(1) per query"],
["Rotate Image","rotate-image","M","Transpose + reverse","Transpose the matrix in place, then reverse each row for a clockwise rotation.","O(n²) time, O(1) space"],
["Set Matrix Zeroes","set-matrix-zeroes","M","In-place markers","Use the first row and column as zero flags, with two booleans for whether they themselves need zeroing.","O(m·n) time, O(1) space"],
["Find All Numbers Disappeared in an Array","find-all-numbers-disappeared-in-an-array","E","Index marking","For each x, negate nums[|x|−1]; indices that stay positive are the missing numbers.","O(n) time, O(1) extra space"],
["Next Permutation","next-permutation","M","Pivot + reverse suffix","Find the rightmost i with a[i] < a[i+1], swap it with the next larger element from the right, then reverse the suffix.","O(n) time, O(1) space"],
["Maximum Product Subarray","maximum-product-subarray","M","Track max and min","Keep both the max and min product ending here, because a negative number swaps them.","O(n) time, O(1) space"],
["Range Sum Query 2D - Immutable","range-sum-query-2d-immutable","M","2D prefix sums","Build a 2D prefix table and answer with inclusion–exclusion of four corners.","O(m·n) build, O(1) per query"],
["Game of Life","game-of-life","M","State encoding in place","Encode the next state in a second bit of each cell, then shift every cell once at the end.","O(m·n) time, O(1) space"],
["Car Pooling","car-pooling","M","Difference array","Add passengers at 'from', subtract at 'to', prefix-sum over positions and check capacity is never exceeded.","O(n + maxPos) time"],
["Majority Element II","majority-element-ii","M","Extended Boyer–Moore","At most two elements can exceed n/3: track two candidates with counters, then verify counts in a second pass.","O(n) time, O(1) space"],
["Find the Duplicate Number","find-the-duplicate-number","M","Floyd cycle detection","Treat each value as a pointer to the next index; the duplicate is the entrance of the cycle.","O(n) time, O(1) space"],
["Maximum Sum Circular Subarray","maximum-sum-circular-subarray","M","Kadane on max and min","Answer is max(maxSubarray, total − minSubarray), except when every number is negative.","O(n) time, O(1) space"],
["Longest Mountain in Array","longest-mountain-in-array","M","Up/down run scan","From each valley walk up then down, counting the run; skip ahead to the end of each mountain.","O(n) time, O(1) space"],
["Corporate Flight Bookings","corporate-flight-bookings","M","Difference array","Add seats at first−1, subtract at last, then prefix-sum to get each flight's total.","O(n + bookings) time"],
["Best Time to Buy and Sell Stock II","best-time-to-buy-and-sell-stock-ii","M","Greedy sum of rises","With unlimited transactions, add every positive day-to-day difference.","O(n) time, O(1) space"],
["Max Consecutive Ones","max-consecutive-ones","E","Run counting","Count the current run of 1s, reset on 0, keep the maximum.","O(n) time, O(1) space"],
["First Missing Positive","first-missing-positive","H","Cyclic placement","Swap each x in [1, n] into index x−1; the first index i with nums[i] ≠ i+1 gives the answer.","O(n) time, O(1) space"],
["Minimum Number of K Consecutive Bit Flips","minimum-number-of-k-consecutive-bit-flips","H","Greedy + difference array","Scan left to right; flip a window whenever the current bit (after pending flips) is 0, tracking where flips end.","O(n) time, O(n) or O(1) space"]
],
"Strings":[
["Valid Palindrome","valid-palindrome","E","Two pointers","Move pointers inward, skipping non-alphanumerics and comparing lowercase characters.","O(n) time, O(1) space"],
["Valid Anagram","valid-anagram","E","Character counts","Count characters of one string and decrement with the other; all counts must return to zero.","O(n) time, O(1) space (fixed alphabet)"],
["Longest Common Prefix","longest-common-prefix","E","Vertical scan","Compare characters column by column across all strings until a mismatch or end.","O(total chars) time"],
["Reverse Words in a String","reverse-words-in-a-string","M","Split and reverse","Split on whitespace, drop empties, reverse, join; in-place variant reverses the whole string then each word.","O(n) time"],
["Isomorphic Strings","isomorphic-strings","E","Bijection maps","Keep two maps (s→t and t→s) and reject any conflicting mapping.","O(n) time"],
["Valid Palindrome II","valid-palindrome-ii","E","Two pointers + one skip","On the first mismatch, check whether skipping either the left or the right char leaves a palindrome.","O(n) time, O(1) space"],
["Longest Palindromic Substring","longest-palindromic-substring","M","Expand around center","Expand from each of the 2n−1 centers and keep the longest palindrome.","O(n²) time, O(1) space"],
["Roman to Integer","roman-to-integer","E","Subtractive rule","Add each value, but subtract it when a smaller symbol precedes a larger one.","O(n) time"],
["String to Integer (atoi)","string-to-integer-atoi","M","Careful parsing","Skip spaces, read sign, read digits, and clamp before overflowing 32-bit bounds.","O(n) time"],
["Zigzag Conversion","zigzag-conversion","M","Row simulation","Append characters to rows while bouncing the row index between 0 and numRows−1.","O(n) time"],
["Add Binary","add-binary","E","Digit-by-digit carry","Add from the right with a carry, then reverse the collected digits.","O(max(m,n)) time"],
["String Compression","string-compression","M","Read/write pointers","Read a run of equal chars, write the char and its count digits in place.","O(n) time, O(1) space"],
["Palindromic Substrings","palindromic-substrings","M","Expand around center","Count every successful expansion from each of the 2n−1 centers.","O(n²) time, O(1) space"],
["Multiply Strings","multiply-strings","M","Grade-school multiplication","Multiply digit pairs into position i+j+1 of a result array and propagate carries.","O(m·n) time"],
["Repeated Substring Pattern","repeated-substring-pattern","E","String doubling trick","s is built from a repeated block iff s occurs in (s+s) with the first and last chars removed.","O(n) with KMP"],
["Compare Version Numbers","compare-version-numbers","M","Split and compare","Split by '.', compare revisions as integers, treating missing ones as 0.","O(n) time"],
["Find the Index of the First Occurrence in a String","find-the-index-of-the-first-occurrence-in-a-string","E","KMP","Build the prefix (failure) function of the needle, then scan the haystack without backtracking.","O(n + m) time"],
["Integer to Roman","integer-to-roman","M","Greedy table","Walk a value table including subtractive pairs (900, 400, 90…) and emit symbols greedily.","O(1) time"],
["Repeated DNA Sequences","repeated-dna-sequences","M","Rolling hash / set","Slide a 10-char window, hashing (or bit-encoding) it, and record windows seen twice.","O(n) time"],
["Count and Say","count-and-say","M","Run-length encoding","Build each term by run-length encoding the previous one.","O(total output length)"],
["Reorganize String","reorganize-string","M","Greedy with max-heap","Always place the most frequent char that differs from the last; impossible if any count > (n+1)/2.","O(n log k) time"],
["Longest Happy Prefix","longest-happy-prefix","H","KMP prefix function","The last value of the prefix function is the length of the longest prefix that is also a suffix.","O(n) time"],
["Shortest Palindrome","shortest-palindrome","H","KMP on s#reverse(s)","The prefix function of s + '#' + reverse(s) gives the longest palindromic prefix; prepend the reversed rest.","O(n) time"],
["Longest Duplicate Substring","longest-duplicate-substring","H","Binary search + rolling hash","Binary search on the length and use Rabin–Karp to test whether any substring of that length repeats.","O(n log n) expected"],
["Text Justification","text-justification","H","Greedy line packing","Pack as many words per line as fit, then distribute spaces with extras going left; last line is left-justified.","O(total chars) time"]
],
"Hashing":[
["Two Sum","two-sum","E","Complement lookup","For each x, check whether target − x is already in a value→index map, then store x.","O(n) time, O(n) space"],
["Contains Duplicate","contains-duplicate","E","Hash set","Insert into a set and return true on the first repeat.","O(n) time, O(n) space"],
["First Unique Character in a String","first-unique-character-in-a-string","E","Frequency count","Count characters, then return the first index whose count is 1.","O(n) time"],
["Group Anagrams","group-anagrams","M","Canonical key","Group words by sorted string or by a 26-count tuple as the dictionary key.","O(n·k) with count key"],
["Ransom Note","ransom-note","E","Frequency count","Count magazine letters and decrement for the note; fail if any count goes negative.","O(n + m) time"],
["Happy Number","happy-number","E","Cycle detection","Repeatedly sum squared digits; use a set (or fast/slow pointers) to detect a cycle that never reaches 1.","O(log n) per step"],
["Top K Frequent Elements","top-k-frequent-elements","M","Count + bucket sort","Count frequencies, bucket numbers by frequency, and read buckets from high to low.","O(n) time"],
["Contains Duplicate II","contains-duplicate-ii","E","Last-seen index","Store each value's last index; a repeat within distance k answers true.","O(n) time"],
["Subarray Sum Equals K","subarray-sum-equals-k","M","Prefix sum counts","Keep counts of prefix sums seen; add count[prefix − k] at each step (seed count[0] = 1).","O(n) time, O(n) space"],
["Word Pattern","word-pattern","E","Bijection maps","Map pattern chars to words and words to chars; any mismatch fails.","O(n) time"],
["Longest Consecutive Sequence","longest-consecutive-sequence","M","Set with sequence starts","Only start counting from numbers whose predecessor is absent, then walk forward.","O(n) time"],
["Intersection of Two Arrays II","intersection-of-two-arrays-ii","E","Counter intersection","Count the smaller array and emit elements of the other while counts remain.","O(n + m) time"],
["Valid Sudoku","valid-sudoku","M","Row/column/box sets","Track seen digits per row, column, and 3×3 box (box id = (r//3)*3 + c//3).","O(81) time"],
["Sort Characters By Frequency","sort-characters-by-frequency","M","Count + bucket","Count characters, then output them grouped by descending frequency.","O(n) time"],

"Batch vs Streaming pipelines":`**Key ideas**
- *Batch*: bounded input, runs on a schedule, recomputes over a window (hour/day). Simple, cheap, easy to backfill; freshness = schedule + runtime.
- *Streaming*: unbounded input, processes events continuously with state (windows, joins, dedup). Freshness in seconds; harder to operate, test and backfill.
- *Micro-batch* (Spark Structured Streaming) sits between: small batches every N seconds; *continuous* engines (Flink) process per event.
- Decide on **freshness the consumer actually acts on**, not on what sounds modern. A dashboard read once a day doesn't need Kafka.
- Event time vs processing time: streaming must handle out-of-order and late events with **watermarks**; batch handles them by reprocessing partitions.

\`\`\`
            freshness needed?
      hours+ ──────────► batch (Airflow + Spark/SQL)
      minutes ─────────► micro-batch / incremental batch
      seconds ─────────► streaming (Kafka + Flink/Spark SS)
      <200 ms decision ─► online service + stream (not the warehouse)
\`\`\`

**Common pitfalls**
- Partitioning by arrival time and then calling the data "complete".
- Streaming jobs with unbounded state (no TTL, no watermark) that slowly OOM.
- Two codebases for batch and stream that drift apart.
- No replay/backfill plan for the streaming path.

**Interview tips**
- Always ask: who consumes it, how fresh, how correct (approximate vs exact), what volume and what cost ceiling.
- Mention the cost/complexity of 24×7 streaming vs a scheduled job; propose the simplest thing that meets the SLA.
- Talk about correctness under failure: at-least-once + idempotent sinks, dedup keys, reprocessing.`,
"Lambda/Kappa":`**Key ideas**
- *Lambda*: a **batch layer** recomputes accurate views from the immutable master dataset; a **speed layer** gives low-latency approximate views; a **serving layer** merges them. Correct eventually, but two codebases.
- *Kappa*: one streaming pipeline over a replayable log (Kafka, or a table format like Delta/Iceberg). To fix logic, **replay** the log into a new version of the output, then switch readers.
- Lakehouse "Kappa-over-tables": stream into bronze Delta/Iceberg tables and process incrementally; the table is the durable log.

\`\`\`
Lambda:  events ─► master data ─► batch views ─┐
                 └► speed layer ─► RT views ───┴► serving (merge)
Kappa:   events ─► log (retained) ─► stream job v1 ─► table_v1
                                    └► stream job v2 (replay) ─► table_v2 ─► swap
\`\`\`

**Common pitfalls**
- Speed and batch logic drift, so numbers change at midnight and nobody trusts either.
- Kappa without enough log retention (or tiered storage) makes replay impossible.
- Replaying into the live output table instead of a new version.
- Ignoring schema evolution across the replayed history.

**Interview tips**
- Say *why* Lambda existed (streaming engines weren't exactly-once/stateful enough) and why Kappa is now common.
- Discuss replay speed, retention cost, versioned outputs and cutover.
- Hybrid is fine: stream for freshness, periodic batch "true-up" for finance-grade numbers.`

"Batch vs Streaming pipelines":[
Q("sd-bs-01","Real-time campaign dashboard request","E","Tests whether you push back on unnecessary streaming.",
"Marketing asks for a **real-time** campaign performance dashboard. Today a daily Spark job loads ad impressions and clicks (80 GB/day) into the warehouse by 6 AM. The team lead proposes Kafka + Flink. What do you do?",
"- What decision is made from the dashboard, and how often? (Pausing a campaign? Daily budget review?)\n- How fresh must it be: 1 min, 15 min, 1 hour?\n- Is approximate OK intra-day if it's exact the next morning?",

"- If freshness ≤ 1 hour is enough: switch to **hourly incremental batch** (partition by event hour, process only new files/partitions, MERGE into the fact table). Same code, more frequent schedule.\n- If they truly need minutes for pausing spend: stream only the **alerting** metric (spend vs budget per campaign) with a small streaming job, and keep the dashboard on hourly batch.\n- Add a freshness indicator ('data as of 10:15') on the dashboard.",
"Hourly batch: cheap, one codebase, easy backfill, but ~1 h staleness. Streaming: minute freshness, higher cost and operational load, harder corrections. A split (stream the alert, batch the dashboard) usually wins.",

"- Is the decision synchronous (blocks the payment) or async (flag for review)?\n- Which features, and how fresh must they be?\n- Exactness needed for fraud features vs finance numbers?",

Q("sd-bs-03","Hourly job misses late files","M","Tests event-time vs arrival-time partitioning.",
"An hourly batch job processes `s3://events/dt=YYYY-MM-DD/hr=HH/` one hour after the hour ends. Analysts report the last ~3% of each hour's events are missing, and totals for past hours 'grow' when they rerun queries a day later. Diagnose and fix.",

"- Measure lateness distribution; set a **completeness window** (e.g., 99.9% within 3 h).\n- Option A: process by **arrival partition** (ingest time) and MERGE into event-time partitions of the output, so every file is processed exactly once.\n- Option B: keep event-time partitions but **reprocess the last N hours** each run (sliding recompute) with idempotent overwrite of those partitions.\n- Track per-partition file manifests/watermarks; publish 'partition is final after 3 h' to consumers.",
"Arrival-based ingestion guarantees every file is seen once but needs MERGE; sliding recompute is simple but costs extra compute. Both require telling consumers when data is final.",
["How would you detect late data automatically?","How does Delta/Iceberg change this design?","What if some events arrive 30 days late?"]),
Q("sd-bs-04","Streaming job costs 4× the batch it replaced","M","Tests cost-awareness and matching freshness to consumption.",

"Scheduled incremental processing gives batch-level cost with streaming-style incremental logic; the trade-off is latency equal to the schedule.",
["What does Trigger.AvailableNow do differently from Trigger.Once?","How do checkpoints behave when a job runs once a day?","How would you present this cost change to leadership?"]),
Q("sd-bs-05","Nightly 6-hour aggregation to 15-minute freshness","H","Tests incremental design and state management.",

"CDC":`**Key ideas**
- *Change Data Capture* turns inserts/updates/deletes in an OLTP database into an ordered stream of change events.
- *Query-based* CDC (\`WHERE updated_at > :last\`) is simple but misses hard deletes, depends on a reliable timestamp, and loads the primary.
- *Log-based* CDC (Debezium, AWS DMS, Fivetran HVR) reads the binlog / WAL: captures deletes, ordering and before/after images with little load on the source.
- Pipeline shape: **initial snapshot → stream of changes → apply to target** (MERGE upsert/delete, or append for history/SCD2).
- Each event carries op (c/u/d/r), before/after, source position (binlog file+pos, LSN) and commit timestamp: use the position to order changes per key.

\`\`\`
MySQL binlog ─► Debezium ─► Kafka (topic per table, key = PK)
                                  └► stream job ─► MERGE into Delta/Iceberg (current state)
                                                └► append to history table (SCD2 / audit)
\`\`\`

**Common pitfalls**
- Applying multiple changes for the same key in one batch without picking the latest (non-deterministic MERGE).
- Connector down longer than binlog/WAL retention → gap; Postgres replication slots filling the primary's disk.
- Schema changes breaking deserialisation; Postgres TOASTed columns arriving as unchanged/NULL.
- Ignoring transaction boundaries across tables.

**Interview tips**
- Talk about snapshot + stream handover, ordering per primary key, deletes, schema evolution and monitoring lag.
- Mention reconciliation (counts/checksums) to prove the replica matches the source.
- Know the outbox pattern as the alternative for publishing domain events.`,
"Idempotency & Exactly-once":`**Key ideas**
- *Idempotent*: running an operation twice has the same effect as once. The practical foundation of "exactly-once".
- Delivery semantics: **at-most-once** (may lose), **at-least-once** (may duplicate), **exactly-once** (effectively once: at-least-once delivery + idempotent or transactional processing).
- Techniques: deterministic keys + MERGE/upsert, overwrite-by-partition, dedup on a unique event id, transactional writes (Delta/Iceberg commits, Kafka transactions), idempotency keys for side effects.
- Exactly-once inside an engine (Flink/Spark checkpoints) ≠ end-to-end: the **sink** must be idempotent or transactional.

\`\`\`
at-least-once source + idempotent sink        = effectively once
at-least-once source + append-only sink       = duplicates on retry
checkpointed engine  + 2PC / transactional sink = exactly-once commits
\`\`\`

**Common pitfalls**
- \`INSERT INTO\` in a job that can be retried.
- Non-deterministic transformations (current_timestamp, random UUIDs) making reruns produce different keys.
- Committing Kafka offsets before processing (loss) or processing side effects before commit without idempotency (duplicates).
- External side effects (emails, API calls, payments) inside retried tasks.

**Interview tips**
- For every write, say what happens if it runs twice or dies halfway.
- Name the idempotency key and where it's stored.
- From payments experience: idempotency keys on APIs, ledger entries keyed by (source, event_id), and reconciliation as the safety net.`

"CDC":[
Q("sd-cdc-01","Nightly extract misses deleted orders","E","Tests query-based vs log-based CDC.",
"A nightly job extracts `orders` from MySQL with `WHERE updated_at > :last_run`. Finance finds cancelled-and-deleted orders still in the warehouse, and some updates are missing when `updated_at` wasn't set by the app. What's wrong and what do you propose?",
"- Are rows hard-deleted or soft-deleted?\n- Is `updated_at` maintained by the DB (ON UPDATE) or by application code?\n- Freshness needed?",
"Query-based CDC can't see **hard deletes** and relies on every writer updating `updated_at`; bulk fixes/scripts often bypass it.",
"- Move to **log-based CDC** (Debezium or DMS reading the binlog): captures inserts, updates and deletes with ordering.\n- Snapshot once, then stream changes into Kafka and MERGE into the warehouse table (delete on op = 'd').\n- If CDC isn't possible short term: switch the app to soft deletes, make `updated_at` a DB-maintained column, and run a periodic full key comparison to catch deletes.",
"Log-based CDC adds infrastructure (connector, Kafka) but is complete and low impact; the stopgap is cheaper but still fragile.",
["What binlog settings does Debezium need on MySQL?","How would you detect deletes with only query-based access?","How do you backfill the missed deletes?"]),
Q("sd-cdc-02","Snapshotting a 2 TB table without hurting production","M","Tests initial load strategy.",
"You're starting Debezium CDC on a **2 TB** MySQL `transactions` table that receives 3k writes/s. The default snapshot takes a global read lock and runs for hours. How do you do the initial load safely?",
"- Is there a read replica?\n- Can the table be read in PK ranges?\n- Acceptable replication lag during the load?",
"A locking snapshot blocks writes; a long consistent snapshot also holds binlog position and can pressure the DB.",
"- Use **incremental snapshots** (Debezium signalling / DBLog-style): read the table in PK chunks while streaming changes, with watermark events to resolve conflicts between chunk reads and concurrent updates.\n- Or snapshot from a **read replica** or a bulk export (e.g., from a backup) into the lake, record the binlog position at export time, then start streaming from that position and MERGE (later changes win).\n- Throttle chunk size; monitor replica lag.",
"Incremental snapshots are online and resumable but take longer; backup-based bulk loads are fast but need careful position alignment.",
["How do incremental snapshots avoid overwriting newer changes?","How do you verify the snapshot is complete?","What if the table has no primary key?"]),
Q("sd-cdc-03","Multiple changes for one key in a micro-batch","M","Tests ordering in MERGE.",
"Your streaming job applies CDC events to a Delta table every minute with `MERGE`. Sometimes it fails with 'multiple source rows matched' and sometimes rows end up with an **older** value. Diagnose and fix.",
"- Can one micro-batch contain several updates for the same primary key?\n- What field gives ordering (binlog pos, LSN, ts_ms)?\n- Are there deletes followed by re-inserts?",
"A micro-batch can hold several changes per key. MERGE requires one source row per key; picking an arbitrary one can apply a stale update.",
"- Within each batch, **deduplicate to the latest change per key** using the source position: `ROW_NUMBER() OVER (PARTITION BY pk ORDER BY binlog_file DESC, binlog_pos DESC)` (or LSN).\n- MERGE: when matched and op = 'd' → delete; when matched and newer → update; when not matched and op ≠ 'd' → insert.\n- Store the source position on the target row and only update if incoming position > stored (protects against replayed older batches).",
"Guarding with the stored position costs a column and a comparison but makes the apply idempotent and order-safe.",
["Why is ts_ms not reliable for ordering?","How do you handle delete then re-insert of the same key?","How would you do this in Snowflake or BigQuery?"]),
Q("sd-cdc-04","Source schema change breaks the pipeline","M","Tests schema evolution in CDC.",
"A backend team added a column and renamed another in a MySQL table. The CDC pipeline started failing, and on another table a new column silently never appeared in the lake. How should CDC pipelines handle schema changes?",
"- Is there a schema registry (Avro/Protobuf) between Debezium and consumers?\n- Does the target table allow schema evolution?\n- Is there a contract/process for DDL changes?",
"Consumers built for the old schema fail on renames (breaking change); additive changes are dropped when the sink doesn't evolve its schema.",
"- Put Debezium output through a **schema registry** with a compatibility policy (e.g., BACKWARD) so breaking changes are caught.\n- Enable schema evolution on the sink for **additive** columns (Delta mergeSchema / Iceberg add column).\n- Treat renames/type changes as breaking: add new column → dual-write → migrate consumers → drop old.\n- Add a **data contract** + DDL review step with the source team; alert on schema-change events from Debezium.",
"Automatic evolution keeps pipelines running but can let unwanted columns (e.g., PII) flow downstream; contracts slow teams down slightly but prevent incidents.",
["How does Debezium capture DDL changes?","Should PII columns be allowed to auto-evolve?","How do you backfill a newly added column?"]),
Q("sd-cdc-05","Connector was down longer than binlog retention","H","Tests recovery from CDC gaps.",
"Your Debezium connector was down for **2 days** during an incident. MySQL binlog retention is 24 hours, so the connector can't resume from its last offset. How do you recover without losing changes?",
"- Can you take a new snapshot? How big are the tables?\n- Which downstream consumers need the full change history vs just current state?\n- Were there deletes in the gap?",
"The change events for the gap are gone; the only source of truth is the **current state** of the tables.",
"- Re-snapshot the affected tables (incremental snapshot to avoid locks) and MERGE into the target: this fixes **current state** including updates.\n- Detect **deletes** from the gap by comparing primary keys (anti-join source keys vs target keys) and delete missing ones.\n- Intermediate changes in the gap are lost; if history/SCD2 matters, mark the gap in the history table and tell consumers.\n- Prevent recurrence: increase binlog retention (e.g., 7 days), alert on connector lag/downtime, run the connector with HA.",
"Re-snapshot restores correctness of current state but not the lost history; longer binlog retention costs disk on the primary.",
["How would you compare keys of a 1B-row table efficiently?","What alerting would have caught this earlier?","How does this differ for Postgres replication slots?"]),
Q("sd-cdc-06","Building SCD Type 2 history from CDC","M","Tests history modelling from change streams.",
"Analysts need the **full history** of customer attributes (tier, city, status) with valid_from / valid_to, built from Debezium CDC on the `customers` table. Design the pipeline.",
"- Which attributes should trigger a new version (all or a subset)?\n- Is effective time the DB commit time?\n- Late or replayed events possible?",
"CDC gives before/after images with commit timestamps: exactly what SCD2 needs, but ordering and replays must be handled.",
"- Keep a raw **append-only change log** table (every CDC event).\n- Build SCD2: per key, order changes by source position, keep only changes where tracked columns differ, set valid_from = commit ts, valid_to = next change's ts (or null), is_current flag.\n- Incremental: for new events, close the current row (update valid_to) and insert the new version in one MERGE; dedup by source position to be replay-safe.\n- Deletes: close the current row and mark is_deleted.",
"An append-only change log makes SCD2 rebuildable any time; incremental MERGE is cheaper but trickier for out-of-order events.",
["How do you handle two changes with the same commit timestamp?","What if an out-of-order change arrives for an older time?","How would you query 'customer tier as of 2025-03-01'?"]),
Q("sd-cdc-07","Propagating deletes for GDPR","M","Tests delete handling across layers.",
"A user requests account deletion (GDPR). The source DB hard-deletes the row and CDC emits a delete. The data also exists in bronze (raw CDC log), silver, gold aggregates and a Kafka topic with 7-day retention. How do you ensure the data is erased?",
"- Legal deadline (e.g., 30 days)?\n- Which layers hold identifiable data vs aggregates?\n- Are there backups and time-travel snapshots?",
"Applying the delete to the current-state table isn't enough: raw logs, history tables and snapshots still contain the personal data.",
"- Current-state tables: MERGE applies the delete.\n- Raw/history tables: run a periodic **erasure job** that deletes or anonymises rows for erased user_ids (tracked in an erasure request table), then VACUUM / expire snapshots so old files are removed.\n- Kafka: short retention (7 days) naturally expires; or use key-based compaction with tombstones for compacted topics.\n- Gold aggregates without identifiers can stay.\n- Keep an audit log of erasure requests and completion (without personal data).",
"Physical deletion in lakehouse tables means rewriting files (cost) and losing time travel for those versions; crypto-shredding (per-user keys) is an alternative for large logs.",
["What is crypto-shredding?","How do you erase from backups?","How do you prove to auditors that erasure happened?"]),
Q("sd-cdc-08","Consumers see half-applied transactions","H","Tests transaction boundaries across tables.",
"An order is written to `orders` and `order_items` in one DB transaction. Downstream, a streaming job sometimes sees the order without its items (or items without the order), producing wrong order totals. Why, and how do you fix it?",
"- Separate Kafka topics per table?\n- Does the connector emit transaction metadata?\n- Is eventual consistency acceptable for a short window?",
"Debezium writes each table to its own topic/partitions; consumers read them independently, so transactional atomicity is lost.",
"- Enable Debezium **transaction metadata** (BEGIN/END events with event counts per table); buffer changes by transaction id until all events arrive, then apply together.\n- Or use the **outbox pattern**: the service writes a single `order_created` event (with items) to an outbox table in the same transaction; CDC publishes only the outbox.\n- Or tolerate it: compute totals in batch after a delay, or in streaming with a join that waits for items (watermarked).",
"Transaction buffering is precise but complex; the outbox gives clean domain events but requires app changes; delayed processing is simplest when latency allows.",
["How does the outbox pattern avoid dual writes?","How big can transaction buffers get?","What ordering guarantees do you need across partitions?"]),
Q("sd-cdc-09","Postgres replication slot fills the primary disk","M","Tests Postgres-specific CDC operations.",
"Your Postgres primary ran low on disk. You discover the **logical replication slot** used by Debezium retained 400 GB of WAL because the connector was paused for maintenance for a day. What happened and how do you prevent it?",
"- Is the slot still active?\n- Is `max_slot_wal_keep_size` configured (PG 13+)?\n- Are there low-traffic tables causing slot position not to advance?",
"A logical slot keeps WAL until the consumer confirms it; a stopped consumer makes WAL grow without bound.",
"- Immediate: resume the connector (or drop and recreate the slot and re-snapshot if too far behind) to free WAL.\n- Prevention: set `max_slot_wal_keep_size` to cap retained WAL, alert on slot lag (pg_replication_slots.restart_lsn vs current LSN), enable Debezium **heartbeats** so the slot advances even when captured tables are idle.\n- Treat connector downtime as an incident with an SLA.",
"Capping WAL protects the primary but can invalidate the slot, forcing a re-snapshot; that's the right trade-off for production DBs.",
["Why do heartbeats help on idle tables?","What's the difference between physical and logical replication slots?","How do you re-snapshot after a slot is invalidated?"]),
Q("sd-cdc-10","Partitioning CDC topics and hot keys","M","Tests ordering vs parallelism.",
"CDC events for `accounts` go to a Kafka topic keyed by `account_id` with 12 partitions. One merchant account generates **40%** of changes and its partition lags by minutes. Consumers need per-account ordering. What do you do?",
"- Is ordering needed per account or per row?\n- Can the hot account's updates be coalesced?\n- Where is the bottleneck: consumer processing or sink writes?",
"Per-key ordering pins a key to one partition; a hot key caps throughput at one consumer thread.",
"- First make the consumer faster for that partition: batch and **coalesce** changes per key (only the latest state matters for current-state tables), bulk MERGE.\n- If ordering is needed per **row** not per account, key by the row PK (e.g., transaction_id) to spread load.\n- If the downstream needs per-account order, keep the key but split the heavy work (enrichment) into a parallel stage that re-orders by sequence before the sink.",
"Changing the key spreads load but weakens ordering guarantees; coalescing keeps order and cuts writes but loses intermediate states.",
["Why doesn't adding partitions fix a hot key?","How would you re-order events after parallel processing?","What does coalescing break for SCD2?"]),
Q("sd-cdc-11","Debezium vs managed CDC for 40 tables","E","Tests build-vs-buy judgment.",
"You need CDC from **40 MySQL tables** into Snowflake with ~5-minute freshness. The team is 4 engineers. Options: self-managed Debezium + Kafka Connect, AWS DMS, or a vendor like Fivetran. How do you decide?",
"- Budget: infra + people vs per-row vendor pricing?\n- Other consumers of the change stream (microservices, search)?\n- Compliance: can data leave your VPC?",
"The trade-off is operational effort vs cost and control.",
"- If the only consumer is the warehouse and budget allows: **managed** (Fivetran/DMS) is fastest to deliver and operate.\n- If multiple consumers need the stream (search indexing, cache invalidation, events), **Debezium + Kafka** gives a reusable event backbone.\n- Estimate cost of both at current and 3× volume; include on-call time.\n- Either way: monitor lag, schema changes and row-count reconciliation.",
"Managed = less control, vendor cost that grows with volume; Debezium = more flexibility, more operations.",

Q("sd-cdc-12","MERGE every minute into a 5B-row table","M","Tests apply efficiency at scale.",
"CDC changes (~2M/hour) are MERGEd every minute into a **5-billion-row** Delta table. Each MERGE takes 4 minutes, so lag keeps growing, and the table now has millions of small files. Fix it.",
"- How is the target partitioned/clustered?\n- Distribution of updated keys (recent vs random)?\n- Freshness actually required?",
"Each MERGE scans a large part of the table to find matches; frequent small commits create small files.",
"- **Prune the join**: add a partition/cluster column that correlates with changes (e.g., created_date or Z-order/liquid clustering on the PK) and include it in the MERGE condition.\n- Increase the batch interval (5 min) so each MERGE does more work per scan.\n- Enable deletion vectors (Delta) to avoid rewriting whole files for small updates.\n- Schedule OPTIMIZE/compaction; consider a two-table design: append changes to a small delta table and merge into the big table less often, serving reads via a view that unions/latest-wins.",

Q("sd-cdc-13","Proving the replica matches the source","H","Tests reconciliation design.",
"Auditors ask you to **prove** that the lakehouse copy of the `ledger_entries` table (CDC-fed, 800M rows) matches the MySQL source. How do you design ongoing reconciliation?",
"- Acceptable lag window for comparisons?\n- Can you run heavy queries on a replica?\n- Which columns matter (amounts, status)?",
"Row counts alone hide mismatched values; comparing every row every day is expensive.",
"- Compare at a consistent point: record the binlog position/GTID when reading source aggregates, compare target up to the same position.\n- Level 1: counts and sum(amount) per day/partition.\n- Level 2: per-bucket **checksums** (e.g., hash of PK + key columns, aggregated with BIT_XOR/SUM of hashes) per PK range; drill down only into mismatched buckets.\n- Level 3: row-level diff for mismatched buckets; auto-repair by re-reading those rows.\n- Store reconciliation results and alert on mismatches.",

Q("sd-cdc-14","Postgres updates arriving with missing column values","M","Tests REPLICA IDENTITY and TOAST handling.",
"Your Postgres CDC pipeline occasionally writes **NULL** into a large `jsonb` column for updates that didn't touch that column, wiping real data in the target. Why, and how do you fix it?",
"- Which Postgres REPLICA IDENTITY is set on the table?\n- How does the connector represent unchanged TOASTed values?\n- Does the sink overwrite all columns on update?",
"Large values are TOASTed; if they didn't change, logical decoding doesn't include them, and Debezium emits a placeholder (unavailable value). A sink that overwrites every column writes NULL/placeholder.",

"Sink-side handling keeps WAL small but adds per-column logic; REPLICA IDENTITY FULL is simpler downstream but increases WAL volume and load.",
["What is TOAST in Postgres?","What does REPLICA IDENTITY DEFAULT log for updates?","How would you repair the already wiped rows?"]),
Q("sd-cdc-15","Outbox pattern vs table CDC for domain events","M","Tests event design over raw table changes.",
"Other teams consume your raw table CDC topics (`orders`, `order_items`, `payments`) and each re-implements business logic to figure out 'order was paid'. Refactors of the DB schema break them. What would you propose?",
"- Who owns the events and their schema?\n- Do consumers need every column or business facts?\n- Can the service write an extra table in the same transaction?",
"Raw table CDC exposes internal schema as a public contract: tight coupling and duplicated logic.",
"- **Outbox pattern**: in the same DB transaction as the business change, the service inserts a domain event (`OrderPaid` with a stable schema) into an outbox table; Debezium's outbox router publishes it to a topic.\n- Version event schemas in a registry; internal tables can change freely.\n- Keep raw CDC for analytics replication only, not for service-to-service contracts.",

"Idempotency & Exactly-once":[
Q("sd-io-01","Rerun of a daily job doubles the rows","E","Tests the most basic idempotent write.",
"A daily Spark job does `INSERT INTO sales_daily SELECT ... WHERE dt = '{{ ds }}'`. When Airflow retries after a timeout, totals for that day **double**. Fix it.",
"- Is the table partitioned by dt?\n- Can a run be partially written before failing?\n- Do other jobs write the same partition?",
"Append-only writes aren't idempotent: each retry adds the same rows again.",
"- Use **partition overwrite**: `INSERT OVERWRITE ... PARTITION (dt)` with dynamic partition overwrite mode, or Delta `replaceWhere dt = '...'`.\n- Or MERGE on a natural key (dt, store_id, product_id).\n- Ensure the transformation is deterministic (no current_timestamp in keys).\n- Only one job owns each partition.",
"Overwrite is simple and fast for full-partition outputs; MERGE handles partial updates but costs more.",
["What's the difference between static and dynamic partition overwrite in Spark?","What if a partial write happened before the failure?","How do you make a job idempotent when the output isn't partitioned?"]),
Q("sd-io-02","Failed job leaves partial files in S3","M","Tests atomic writes on object storage.",
"A Spark job writing Parquet to `s3://lake/fact_orders/dt=2026-09-25/` failed halfway. The rerun succeeded, but Athena queries now return **duplicated rows** for that date. Why, and how do you prevent it?",
"- Plain Parquet or a table format (Delta/Iceberg/Hudi)?\n- Which committer is used?\n- Does the rerun overwrite or append?",
"Plain file writes on S3 aren't atomic: files from the failed attempt remain in the folder and are read alongside the rerun's files.",
"- Use a **table format** (Delta/Iceberg): writes become atomic commits; readers only see files in committed snapshots, and failed attempts leave orphan files that are never read (cleaned by VACUUM/expire).\n- If stuck with plain Parquet: write to a temp prefix, then swap (update the Glue partition location to the new prefix), and use the S3A magic/partitioned committers.\n- Make reruns overwrite the partition.",
"Table formats solve atomicity and add features (time travel, MERGE) at the cost of metadata maintenance.",
["How does Delta's transaction log make commits atomic?","What does the S3A magic committer do?","How do you clean up orphan files?"]),
Q("sd-io-03","Duplicate messages from producer retries","M","Tests Kafka producer semantics.",
"A service produces events to Kafka with `acks=all` and retries. Consumers see occasional **duplicate events** after broker leader elections. Explain why and fix it at the producer.",
"- Is `enable.idempotence` on?\n- `max.in.flight.requests.per.connection` value?\n- Do consumers also need dedup?",
"A produce request can succeed on the broker but the ack is lost (e.g., leader change); the producer retries and the message is written twice.",
"- Enable the **idempotent producer** (`enable.idempotence=true`, default in recent clients): broker dedups retries using producer id + sequence numbers per partition, and ordering is kept with up to 5 in-flight requests.\n- This only covers retries within a producer session; application-level re-sends (service restarts and re-sends) still need an event id and consumer-side dedup.",
"Idempotent producers are near-free; full exactly-once across restarts needs transactions or consumer dedup.",
["What changes with transactional.id?","Why can ordering break with retries and multiple in-flight requests without idempotence?","Where would you dedup on the consumer side?"]),
Q("sd-io-04","Webhook processing that calls an external payout API","H","Tests idempotent side effects (payments).",
"Your consumer reads `payout_requested` events from Kafka and calls a bank's payout API. After a consumer crash, some merchants were **paid twice**. Design exactly-once payouts.",
"- Does the bank API support idempotency keys?\n- Can you query payout status by reference?\n- What's the event's unique id?",
"The consumer called the API, crashed before committing the offset, and reprocessed the event after restart. Offsets can't be committed atomically with an external side effect.",
"- Use an **idempotency key** = payout_request_id on every bank call; the bank returns the original result for repeats.\n- Keep a local `payouts` table with a unique constraint on request_id and a state machine (PENDING → SENT → CONFIRMED/FAILED). Before calling, insert PENDING (fails if exists → look up state instead).\n- On restart, for PENDING/unknown states, **query the bank by reference** before retrying.\n- Daily reconciliation against the bank's settlement file catches anything missed.",
"More state and code, but money-moving side effects must be idempotent; reconciliation is the final safety net.",
["What if the bank has no idempotency support?","How do you handle a timeout where you don't know if the payout happened?","How long do you keep idempotency records?"]),
Q("sd-io-05","Offset commit timing: loss vs duplicates","M","Tests consumer commit semantics.",
"A Kafka consumer writes events to Postgres. With auto-commit enabled, you lost events after a crash. A teammate changed it to commit **after** writing, and now you see duplicates after restarts. What's the correct design?",
"- Can the Postgres write be an upsert?\n- Are writes batched?\n- Can offsets be stored in Postgres?",
"Auto-commit may commit before processing (loss on crash). Committing after processing gives at-least-once: a crash between write and commit replays the batch.",
"- Keep **commit after processing** (at-least-once) and make the write **idempotent**: upsert on event_id (unique constraint).\n- Or store offsets **in the same Postgres transaction** as the data (a `consumer_offsets` table); on startup, seek to stored offsets. Then data + offset commit atomically: exactly-once.",
"Upsert is simplest; transactional offset storage gives exact semantics but moves offset management into your code.",
["How do you seek to stored offsets on rebalance?","What about batches that span many partitions?","Why is auto-commit dangerous here?"]),
Q("sd-io-06","Airflow retry sends reports twice","M","Tests task design with side effects.",
"An Airflow task builds a CSV, uploads it to a partner's SFTP, loads a table and emails the partner. When the task fails on the email step and retries, the partner receives **two files** and the table gets duplicate rows. Redesign it.",
"- Which steps are idempotent today?\n- Can the partner handle overwriting the same file name?\n- Is there a record of what was delivered?",
"One task with multiple side effects; a retry repeats all of them.",
"- Split into separate tasks: build (write to a deterministic path keyed by ds), load (partition overwrite), upload (deterministic filename, overwrite or skip if a delivery record exists), notify.\n- Keep a **delivery log** table (ds, partner, file checksum, status); upload/notify check it first.\n- Retries then only repeat the failed step, and each step is safe to repeat.",
"More tasks and a small state table, but retries become safe and failures easier to see.",
["How do you make an email idempotent?","Why use deterministic file names?","How would you backfill 30 days for this partner?"]),
Q("sd-io-07","foreachBatch to a JDBC database","H","Tests exactly-once with Spark sinks.",
"A Spark Structured Streaming job uses `foreachBatch` to write aggregates into MySQL. After a driver restart, some micro-batches were **written twice**. How do you make the sink exactly-once?",
"- Output keyed or append-only?\n- Can you use the batchId?\n- Is the MySQL write done in a single transaction per batch?",
"Spark may re-execute the last micro-batch after a restart (checkpoint committed after the sink write). foreachBatch is at-least-once.",
"- Use the **batchId**: in one MySQL transaction, write the data and upsert `(query_name, last_batch_id)` into a control table; skip the batch if batchId ≤ stored id.\n- Or write with upserts keyed by (window, key) so replays overwrite.\n- Avoid non-deterministic logic inside the batch so a replay produces the same rows.",
"Batch-id tracking gives exact semantics for append sinks; upserts are simpler for keyed aggregates.",
["When exactly does Spark commit the checkpoint relative to the sink?","Is the replayed batch guaranteed to contain the same data?","How does Delta's txnVersion/txnAppId option help?"]),
Q("sd-io-08","Dedup without a natural event id","M","Tests designing idempotency keys.",
"Clickstream events from an old SDK have **no event_id**. Retries cause duplicates (~1%). You need accurate session and conversion metrics. How do you dedup?",
"- Which fields are always present (device_id, ts with ms, event type, payload)?\n- Can you change the SDK going forward?\n- Tolerance for false-positive dedup?",
"Without a unique id, you must construct one; exact duplicates from retries share the same content.",
"- Short term: build a **deterministic hash** of (device_id, client_timestamp_ms, event_type, normalised payload) and dedup on it within a time window.\n- Beware false positives: two genuine identical events in the same millisecond (rare; accept or add a client sequence number).\n- Long term: update the SDK to generate a UUID per event at creation (not per send) plus a per-device sequence number.",
"Hash dedup fixes most duplicates with small risk of merging real events; SDK changes fix it properly but take months to roll out.",
["Why must the UUID be generated at event creation, not at send time?","How long should the dedup window be?","How do you measure how many duplicates remain?"]),
Q("sd-io-09","MERGE gives different results on rerun","M","Tests determinism.",
"A job MERGEs daily customer snapshots into a dimension table. Reruns for the same day produce **different surrogate keys** and change `updated_at`, breaking downstream joins. Why, and how do you fix it?",
"- How are surrogate keys generated (UUID(), monotonically_increasing_id)?\n- Where does updated_at come from?\n- Do facts reference surrogate keys?",
"Non-deterministic functions (UUID, row ids, current_timestamp) make the output depend on when/how the job ran, not only on the input.",
"- Generate surrogate keys deterministically: hash of natural key (+ version), or look up existing keys and only generate for truly new rows.\n- Take timestamps from the input (source commit time / ds), not `current_timestamp()`.\n- Only update rows whose tracked attributes actually changed (compare hashes).",
"Hash keys avoid a lookup but are wide and can collide (use 64/128-bit); sequence-based keys need a stable key-assignment table.",
["What collision risk does a 64-bit hash have at 1B keys?","Why does monotonically_increasing_id change between runs?","How do you backfill keys for existing facts?"]),
Q("sd-io-10","Kafka read-process-write exactly-once","H","Tests Kafka transactions.",
"A service reads from topic `payments`, enriches events and writes to topic `payments_enriched`. After crashes, downstream sees duplicates. How do you achieve exactly-once between the two topics?",
"- Is the processing Kafka-to-Kafka only (no external side effects)?\n- Which client/framework (plain client, Kafka Streams, Flink)?\n- Downstream consumers' isolation level?",
"Output was produced but input offsets weren't committed before the crash, so input is reprocessed and output duplicated.",
"- Use **Kafka transactions**: set a `transactional.id`, `beginTransaction`, produce outputs, `sendOffsetsToTransaction` for consumed offsets, `commitTransaction`. Output and offset commit are atomic.\n- Downstream consumers must use `isolation.level=read_committed` to skip aborted records.\n- Kafka Streams: `processing.guarantee=exactly_once_v2` does this for you.",
"Transactions add latency (commit interval) and only cover Kafka; external side effects still need idempotency.",

"Backfills":`**Key ideas**
- A *backfill* recomputes historical outputs: new column/metric, bug fix, logic change, missed runs, or a new table that needs history.
- Pre-requisites: **idempotent, partition-scoped jobs** parameterised by date range, raw data still available, and code that is point-in-time correct (joins to dimensions *as of* the event date).
- Run it like a project: estimate cost/runtime, chunk by partition, throttle, checkpoint progress, validate, then publish.
- Prefer writing to a **shadow table/version**, validating, then swapping, over overwriting live data in place.

\`\`\`
plan ─► estimate (TB × cost) ─► chunk by date ─► run in parallel (bounded)
     ─► progress table (chunk, status) ─► validate vs old ─► swap / publish
     ─► cascade downstream (gold, features, extracts) ─► announce
\`\`\`

**Common pitfalls**
- Using *today's* dimension values for historical facts.
- Backfilling while the live job writes the same partitions.
- Flooding the cluster or source DB (no concurrency limits).
- Silently changing already-reported numbers.
- Forgetting downstream tables that were built from the old data.

**Interview tips**
- Mention Airflow catchup/backfill, max_active_runs and pools; chunking by partition; resumability.
- Talk about validation (row counts, sums, diff thresholds) and stakeholder communication.
- Show cost awareness: sample first, estimate, run off-peak or on spot capacity.`,
"Late-arriving data":`**Key ideas**
- *Late data*: records whose event time is earlier than what the pipeline already treated as complete. Causes: mobile/offline clients, retries, upstream delays, batch uploads.
- *Late-arriving dimensions*: a fact references a dimension key that doesn't exist yet (new customer not yet synced).
- Streaming: **watermarks** decide how long to wait; allowed lateness decides whether emitted results are updated; beyond that → side output / drop.
- Batch: **lookback windows** (reprocess last N days), arrival-time ingestion + MERGE into event-time partitions, and explicit *finality* rules (a day is final at D+2).

\`\`\`
event time ───────────────────────────────►
watermark = max_event_time − allowed_delay
  on time  : event_time ≥ watermark  → counted
  late     : window already emitted  → update (if allowed lateness) or side output
  too late : beyond lateness          → correction path (batch restatement)
\`\`\`

**Common pitfalls**
- Measuring freshness by processing time and assuming completeness.
- Append-mode sinks that can't be corrected.
- Inner joins that drop facts with unknown dimension keys.
- No metrics on how late data actually arrives.

**Interview tips**
- Ask for the lateness distribution (p50/p99/max) before choosing a watermark.
- Separate "fresh but provisional" from "final" outputs and label them.
- For dimensions: unknown/inferred member rows, later fixed up.`

"Data Quality frameworks":`**Key ideas**
- Quality dimensions: **freshness, volume, schema, validity** (ranges, formats, enums), **uniqueness**, **completeness** (nulls), **referential integrity**, **consistency/reconciliation** (matches source/other systems), **distribution** (drift, anomalies).
- Where checks run: at ingestion (bronze: schema, parseability), after transforms (silver: keys, validity, RI), before publishing (gold: business rules, reconciliation).
- Severity: **blocking** (stop the pipeline / don't publish) vs **warning** (publish, alert). Bad rows can be **quarantined** instead of failing everything.
- Tools: dbt tests, Great Expectations, Deequ/PyDeequ, Soda, Delta Live Tables expectations, observability platforms (Monte Carlo etc.) for anomaly detection.

\`\`\`
source ─► bronze ─[schema, freshness]─► silver ─[PK unique, not null, RI, ranges]─►
gold ─[business rules, reconciliation, anomaly]─► publish (write-audit-publish)
                         └─ failing rows ─► quarantine table + alert owner
\`\`\`

**Common pitfalls**
- Hundreds of noisy alerts nobody owns → alert fatigue.
- Only testing schema, not meaning (e.g., cents vs dollars).
- Checks after publishing: consumers see bad data first.

**Interview tips**

- An orchestrator schedules and coordinates tasks: dependencies, retries, backfills, SLAs, alerting, lineage of runs. It should **coordinate compute, not do heavy compute itself**.

schedule/event ─► DAG run (logical date) ─► task A ─► task B ─┬─► task C
                   retries, timeouts, SLAs ─────────────────┘   └─► task D

\`\`\`

function bankTake(sec,topic,n){const pool=bankPool(sec,topic);if(!pool||n<=0)return [];sec.bankUsed=sec.bankUsed||{};const i=sec.bankUsed[topic]||0;const items=pool.slice(i,i+n);sec.bankUsed[topic]=i+items.length;return items;}
function bankQ(sec,topic,e,slot){
  const label0=slot==="revision"?"Revision: "+topic:slot==="weak"?"Retry: "+topic:"New: "+topic;
  if(!Array.isArray(e)) return {slot,label:label0,topic,bank:true,bid:e.id,title:e.t,type:"scenario",difficulty:DIFF[e.d]||"Medium",why:e.why||"",prompt:e.q,
    answer:{clarifying:e.c,diagnosis:e.g,solution:e.s,tradeoffs:e.x,followups:e.f||[]},mark:null,applied:null};
  const url="https://leetcode.com/problems/"+e[1]+"/";
  const label=slot==="revision"?"Revision: "+topic:slot==="weak"?"Retry: "+topic:"New: "+topic;
  return {slot,label,topic,bank:true,bid:e[1],title:e[0],type:"leetcode",difficulty:DIFF[e[2]]||"Medium",why:"Pattern tested: "+e[3],
    prompt:"Solve it on LeetCode: ["+e[0]+"]("+url+")\n\n"+(sec.kind==="sql"?"Write your query in MySQL or PostgreSQL before revealing the answer.":"Write your solution in Python and aim for the optimal complexity before revealing the answer."),bankKind:sec.kind,
    answer:{approach:e[4],complexity:e[5],solution:"[Editorial]("+url+"editorial/) and [community solutions]("+url+"solutions/) on LeetCode."},mark:null,applied:null};
}
async function bankSet(sec,key,topic,prev){
  const toQ=(t,items,slot)=>items.map(e=>bankQ(sec,t,e,slot));
  let qs=[],weakUsed=null;
  if(!prev){ qs=toQ(topic,bankTake(sec,topic,5),"new"); }
  else{
    const news=toQ(topic,bankTake(sec,topic,3),"new");
    weakUsed=dueWeak(sec.id).find(w=>w.bid&&(bankPool(sec,w.topic)||[]).some(e=>bidOf(e)===w.bid))||null;
    const rev=toQ(prev,bankTake(sec,prev,weakUsed?1:2),"revision");
    if(weakUsed){const e=bankPool(sec,weakUsed.topic).find(x=>bidOf(x)===weakUsed.bid);const q=bankQ(sec,weakUsed.topic,e,"weak");q.weakId=weakUsed.id;rev.push(q);}
    qs=rev.concat(news);
  }
  const revHave=qs.filter(q=>q.slot!=="new").length, newHave=qs.length-revHave;
  const slots=[];
  if(prev) for(let i=revHave;i<2;i++) slots.push({slot:"revision",topic:prev,difficulty:i?"Hard":"Medium"});
  for(let i=newHave;i<(prev?3:5);i++) slots.push({slot:"new",topic,difficulty:["Easy","Medium","Medium","Hard","Hard"][i]||"Medium"});
  if(slots.length&&cfg.key){try{const extra=await genGroup(sec,slots,qs.map(q=>q.title));const r=extra.filter(q=>q.slot==="revision"),n=extra.filter(q=>q.slot!=="revision");qs=qs.filter(q=>q.slot!=="new").concat(r,qs.filter(q=>q.slot==="new"),n);}catch(e){}}
  if(!qs.length) throw new Error("The built-in questions for this sub-topic are used up. Add a Gemini key in Settings to keep going.");
  let brief=(window.DE_BRIEFS_SEC&&window.DE_BRIEFS_SEC[sec.name]&&window.DE_BRIEFS_SEC[sec.name][topic])||null;
  if(!brief&&sec.brief&&cfg.key){try{brief=(await ask(briefPrompt(sec,topic))).trim();}catch(e){}}
  const tot=daysFor(sec,topic),dn=sec.topicDay||1;
  const set={key,secId:sec.id,day:sec.dayCount+1,created:today(),topic,topicDayLabel:tot>1?"Day "+dn+" of "+tot+" on this sub-topic":"",prevTopic:prev||null,brief,questions:qs,completedOn:null,bank:true};
  sets[key]=set; await save(key,set);
  if(weakUsed) weakUsed.nextDue=addDays(today(),2);
  saveState();
}
async function generateSet(sec){
  if(generating[sec.id]) return;
  const key=setKey(sec), topic=sec.topics[sec.idx], prev=sec.prevTopic;
  const tot=daysFor(sec,topic), dn=sec.topicDay||1;
  const stage=tot>1?"This is day "+dn+" of "+tot+" on this sub-topic: "+(dn===1?"start with the core patterns.":dn===tot?"cover the hardest variants and pattern combinations.":"move beyond earlier days to less common patterns and harder variants.")+" Do not reuse problems listed as previously asked.":"";
  const status={brief:sec.brief?"Writing concept brief…":null,rev:prev?"Writing revision questions…":null,neu:"Writing new questions…"};
  generating[sec.id]={status}; render();
  const upd=(k,v)=>{status[k]=v; if(view.name==="sec"&&view.id===sec.id) renderStatus(status);};
  try{
    if(hasBank(sec,topic)||(prev&&hasBank(sec,prev))){ await bankSet(sec,key,topic,prev); return; }
    const hist=(await Store.get("hist_"+sec.id))||{titles:[]};
    const avoid=hist.titles.slice(-40);
    const odd=sec.dayCount%2===1;
    const briefP=sec.brief?ask(briefPrompt(sec,topic)).then(t=>{upd("brief","Concept brief ready");return t.trim();}).catch(e=>{upd("brief","Concept brief failed: "+(e.message||e.code));return null;}):Promise.resolve(null);
    let questions=[], weakUsed=null;
    if(!prev){
      const g1=await genGroup(sec,[{slot:"new",topic,stage,difficulty:"Easy"},{slot:"new",topic,stage,difficulty:"Medium"},{slot:"new",topic,stage,difficulty:"Medium"}],avoid);
      upd("neu","3 of 5 new questions ready…");
      const g2=await genGroup(sec,[{slot:"new",topic,stage,difficulty:"Medium"},{slot:"new",topic,stage,difficulty:"Hard"}],avoid.concat(g1.map(q=>q.title)));
      upd("neu","New questions ready"); questions=g1.concat(g2);
    }else{
      weakUsed=dueWeak(sec.id)[0]||null;
      const rev=[{slot:"revision",topic:prev,difficulty:odd?"Easy":"Medium"}];
      rev.push(weakUsed?{slot:"weak",topic:weakUsed.topic,difficulty:"Medium",weakId:weakUsed.id,weakTitle:weakUsed.title}:{slot:"revision",topic:prev,difficulty:odd?"Medium":"Hard"});
      const neu=[{slot:"new",topic,stage,difficulty:odd?"Medium":"Easy"},{slot:"new",topic,stage,difficulty:"Medium"},{slot:"new",topic,stage,difficulty:"Hard"}];
      const [r,n]=await Promise.all([
        genGroup(sec,rev,avoid).then(x=>{upd("rev","Revision questions ready");return x;}),
        genGroup(sec,neu,avoid).then(x=>{upd("neu","New questions ready");return x;})
      ]);
      questions=r.concat(n);
    }
    const brief=await briefP;
    const set={key,secId:sec.id,day:sec.dayCount+1,created:today(),topic,topicDayLabel:tot>1?"Day "+dn+" of "+tot+" on this sub-topic":"",prevTopic:prev||null,brief,questions,completedOn:null};
    sets[key]=set; await save(key,set);
    hist.titles=hist.titles.concat(questions.map(q=>q.title)).slice(-120); save("hist_"+sec.id,hist);
    if(weakUsed){weakUsed.nextDue=addDays(today(),2); saveState();}
  }catch(e){
    toast("Couldn't generate the set: "+((e&&(e.message||e.code))||"unknown error"));
  }finally{ delete generating[sec.id]; render(); }
}

/* ---------- actions ---------- */
function markQ(sec,set,i,m){
  const q=set.questions[i]; q.mark=q.mark===m?null:m;
  const wid=set.key+"_"+i, ex=state.weak.find(w=>w.id===wid);
  if(q.slot==="weak"&&q.weakId&&q.mark&&q.applied!==q.mark){
    const w=state.weak.find(x=>x.id===q.weakId);
    if(w){ if(q.mark==="solved"){w.reps=(w.reps||0)+1; if(w.reps>=3) state.weak=state.weak.filter(x=>x!==w); else w.nextDue=addDays(today(),w.reps===1?3:7);}
      else {w.reps=0;w.status=q.mark;w.nextDue=addDays(today(),1);} }
    q.applied=q.mark;
  }else if(q.slot!=="weak"){
    if(q.mark==="review"||q.mark==="failed"){ if(ex) ex.status=q.mark; else state.weak.push({id:wid,secId:sec.id,topic:q.topic,title:q.title,bid:q.bid||null,status:q.mark,added:today(),nextDue:addDays(today(),1),reps:0}); }
    else if(ex&&!ex.reps) state.weak=state.weak.filter(w=>w!==ex);
  }
  state.weak=state.weak.slice(-300);
  save(set.key,set); saveState(); render();
}
function completeSet(sec,set){
  set.undo={idx:sec.idx,topicDay:sec.topicDay||1,prevTopic:sec.prevTopic,lastDone:sec.lastDone,completed:sec.completed.slice(),hadActivity:state.activity.includes(today())};
  const topic=sec.topics[sec.idx];
  if((sec.topicDay||1)<daysFor(sec,topic)){ sec.topicDay=(sec.topicDay||1)+1; }
  else { if(!sec.completed.includes(topic)) sec.completed.push(topic); sec.idx++; sec.topicDay=1; }
  sec.prevTopic=topic; sec.dayCount++; sec.lastDone=today();
  if(!state.activity.includes(today())) state.activity.push(today());
  state.activity=state.activity.slice(-500);
  set.completedOn=today();
  save(set.key,set); saveState(); render();
}
function undoComplete(sec,set){
  const u=set.undo; if(!u) return;
  sec.idx=u.idx; sec.topicDay=u.topicDay||1; sec.prevTopic=u.prevTopic; sec.lastDone=u.lastDone; sec.completed=u.completed; sec.dayCount--;
  if(!u.hadActivity&&!state.sections.some(s=>s!==sec&&s.lastDone===today())) state.activity=state.activity.filter(d=>d!==today());
  set.completedOn=null; delete set.undo;
  save(set.key,set); saveState(); render();
}
function arm(id,fn){ if(armed[id]){delete armed[id];fn();} else {armed[id]=1;render();setTimeout(()=>{if(armed[id]){delete armed[id];render();}},4000);} }

function weakList(list){
  if(!list.length) return '<div class="list"><div class="empty">Questions you mark “Needs review” or “Couldn\'t solve” show up here and come back in later revision slots.</div></div>';
  const sorted=list.slice().sort((a,b)=>a.nextDue<b.nextDue?-1:1);
  return '<div class="list">'+sorted.map(w=>{const s=secById(w.secId);return '<div class="row"><div class="grow"><div class="name">'+esc(w.title)+'</div><div class="muted">'+esc(s?s.name:"Removed section")+", "+esc(w.topic)+(w.nextDue<=today()?", due now":", back on "+esc(w.nextDue))+'</div></div><span class="chip '+esc(w.status)+'">'+(w.status==="failed"?"Couldn't solve":"Needs review")+'</span><button class="btn small" data-rmweak="'+esc(w.id)+'">'+(armed["w"+w.id]?"Click to confirm":"Mark resolved")+"</button></div>";}).join("")+"</div>";
}
function chainHTML(s){
  return '<ol class="chain">'+s.topics.map((t,i)=>{const c=s.completed.includes(t)?"done":(i===s.idx&&!isFinished(s))?"cur":"";const n=daysFor(s,t);return '<li class="'+c+'"><span>'+esc(t)+(n>1?" · "+(c==="cur"?(s.topicDay||1)+"/":"")+n+"d":"")+"</span></li>";}).join("")+"</ol>";
}
function renderStatus(st){const el=$("#genstatus"); if(!el) return; el.innerHTML=["brief","rev","neu"].filter(k=>st[k]).map(k=>'<li class="'+(/ready/.test(st[k])?"ok":/failed/.test(st[k])?"err":"")+'">'+esc(st[k])+"</li>").join("");}
async function renderSection(){
  const s=secById(view.id); if(!s){go({name:"dash"});return;}
  const main=$("#main");
  const head='<div class="wrap"><p class="muted" style="margin:0 0 4px">'+esc(s.name)+", sub-topic "+Math.min(s.idx+(isDoneToday(s)?0:1),s.topics.length)+" of "+s.topics.length+"</p>";
  if(isFinished(s)&&!isDoneToday(s)){
    main.innerHTML=head+"<h1>Section complete</h1>"+chainHTML(s)+'<div class="panel"><p style="margin-top:0">You\'ve worked through every sub-topic here. Start another round to cycle through them again with fresh questions.</p><button class="btn primary" data-round>Start round '+(s.round+1)+"</button></div>"+sectionWeak(s)+"</div>";

  const key=setKey(s);
  if(!(key in sets)){ main.innerHTML=head+'<div class="loading" style="padding:30px 0">Loading…</div></div>'; await loadSet(key); if(view.name!=="sec"||view.id!==s.id) return; }
  const set=sets[key];
  const topic=isDoneToday(s)?(set?set.topic:s.prevTopic):s.topics[s.idx];
  const setDay=set&&set.topicDayLabel?set.topicDayLabel:(!isDoneToday(s)&&daysFor(s,topic)>1?"Day "+(s.topicDay||1)+" of "+daysFor(s,topic)+" on this sub-topic":"");
  let body=head+"<h1>"+esc(topic)+"</h1>"+(setDay?'<p class="muted" style="margin:0">'+esc(setDay)+"</p>":"")+chainHTML(s);
  if(isDoneToday(s)){
    const nt=s.topics[s.idx]; const next=isFinished(s)?"You've finished every sub-topic; start a new round tomorrow.":nt===topic?"Tomorrow: day "+(s.topicDay||1)+" of "+daysFor(s,nt)+" on "+esc(nt)+".":"Tomorrow: revise "+esc(topic)+" and learn "+esc(nt)+".";
    body+='<div class="banner ok">Set completed today. '+next+(set&&set.undo?' <button class="btn small" data-undo style="margin-left:8px">Undo</button>':"")+"</div>";
  }
  if(!set){
    const g=generating[s.id];
    body+='<div class="panel"><p style="margin-top:0">'+(s.prevTopic?"Today's set: 2 revision questions on <b>"+esc(s.prevTopic)+"</b> and 3 new questions on <b>"+esc(topic)+"</b>.":"Day 1: all 5 questions are on <b>"+esc(topic)+"</b>.")+(dueWeak(s.id).length&&s.prevTopic?" One revision slot will revisit a weak area.":"")+"</p>"+
      ((cfg.key||hasBank(s,topic))?'<button class="btn primary" data-gen '+(g?"disabled":"")+">"+(g?"Preparing…":hasBank(s,topic)?"Start today's set":"Generate today's set")+"</button><ul class=\"status\" id=\"genstatus\"></ul>"+(g?'<p class="muted">This usually takes under a minute.</p>':"")
      :'<p class="muted">Add a free Gemini API key in Settings to generate questions.</p><button class="btn primary" data-go="settings">Open settings</button>')+"</div>";
    main.innerHTML=body+sectionWeak(s)+"</div>";

  if(set.brief) body+='<div class="panel brief"><h3>Concept brief</h3>'+md(set.brief)+"</div>";
  body+=set.questions.map((q,i)=>{
    const open=q._open;
