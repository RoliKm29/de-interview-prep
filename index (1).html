    '<div class="actions"><button class="btn small" data-ans="'+i+'" aria-expanded="'+!!open+'">'+(open?"Hide answer":"Show answer")+'</button><div class="marks" role="group" aria-label="How did it go">'+
    [["solved","Solved"],["review","Needs review"],["failed","Couldn't solve"]].map(([m,l])=>'<button data-m="'+m+'" data-mi="'+i+'" aria-pressed="'+(q.mark===m)+'">'+l+"</button>").join("")+"</div></div>"+
    (open?'<div class="answer">'+answerHTML(q)+"</div>":"")+"</article>";
  }).join("");
  if(!set.completedOn){
    const unmarked=set.questions.filter(q=>!q.mark).length;
    body+='<div class="panel" style="display:flex;flex-wrap:wrap;gap:12px;align-items:center"><button class="btn primary" data-complete>Mark set completed</button><span class="muted">'+(unmarked?unmarked+" question"+(unmarked>1?"s":"")+" not marked yet. ":"")+((s.topicDay||1)<daysFor(s,s.topics[s.idx])?"Tomorrow continues "+esc(s.topics[s.idx])+" (day "+((s.topicDay||1)+1)+" of "+daysFor(s,s.topics[s.idx])+")":"Tomorrow moves on to "+esc(s.topics[s.idx+1]||"a new round"))+'.</span>'+(set.bank?"":'<button class="btn small" data-regen style="margin-left:auto">'+(armed["regen"+s.id]?"Click again to replace":"Regenerate set")+"</button>")+"</div>";

}
function sectionWeak(s){const l=state.weak.filter(w=>w.secId===s.id); return l.length?"<h2>Weak areas in this section</h2>"+weakList(l):"";}
function answerHTML(q){
  const a=q.answer||{}; const H=(t,v)=>v&&(!Array.isArray(v)||v.length)?'<section><h4>'+t+"</h4>"+md(v)+"</section>":"";
  let h="";
  if(q.type==="scenario") h=H("Clarifying questions",a.clarifying)+H("Diagnosis",a.diagnosis||a.approach)+H("Solution",a.solution)+H("Tradeoffs",a.tradeoffs)+H("Complexity",a.complexity);
  else if(q.type==="leetcode") h=H("Key idea",a.approach)+H(q.bankKind==="sql"?"Key SQL":"Optimal complexity",a.complexity)+H("Go deeper",a.solution);
  else if(q.type==="behavioral") h=H("What the interviewer is evaluating",a.approach)+H("Model answer (STAR)",a.solution)+H("Pitfalls",a.tradeoffs);
  else h=H("Approach",a.approach)+H("Solution",a.solution)+H("Complexity",a.complexity)+H("Tradeoffs",a.tradeoffs);
  if(Array.isArray(a.followups)&&a.followups.length) h+=H("Follow-up questions",a.followups);
  return h||md("_No answer was returned for this question._");
}

let draft=null;
function renderEdit(){
  if(!draft) draft=state.sections.map(s=>({id:s.id,name:s.name,kind:s.kind,brief:s.brief,topics:s.topics.map(t=>daysFor(s,t)>1?t+" | "+daysFor(s,t):t).join("\n")}));

    '<div class="two"><div><label>Question style</label><select data-f="kind">'+Object.entries(KINDS).map(([k,l])=>'<option value="'+k+'"'+(d.kind===k?" selected":"")+">"+l+"</option>").join("")+'</select></div><div><label>Concept brief</label><select data-f="brief"><option value="1"'+(d.brief?" selected":"")+'>Show before questions</option><option value="0"'+(d.brief?"":" selected")+">Don't show</option></select></div></div>"+

    (secById(d.id)?'<div style="margin-top:10px"><button class="btn small" data-reset="'+esc(d.id)+'">'+(armed["reset"+d.id]?"Click to reset progress":"Reset progress")+"</button></div>":"")+"</div>").join("")+
  '<div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" data-add>Add section</button><button class="btn primary" data-savedit>Save changes</button><button class="btn" data-canceledit>Discard</button></div></div>';
}
function readDraft(){ document.querySelectorAll("[data-di]").forEach(p=>{const d=draft[+p.dataset.di]; p.querySelectorAll("[data-f]").forEach(el=>{const f=el.dataset.f; d[f]=f==="brief"?el.value==="1":el.value;});}); }
function applyDraft(){
  readDraft();
  const out=[];
  for(const d of draft){
    const topicDays={};
    const topics=d.topics.split("\n").map(l=>{const m=l.match(/^(.*?)\s*\|\s*(\d+)\s*$/);const t=(m?m[1]:l).trim();if(t&&m&&+m[2]>1)topicDays[t]=Math.min(30,+m[2]);return t;}).filter(Boolean);
    const name=d.name.trim()||"Untitled section";
    if(!topics.length){toast('"'+name+'" needs at least one sub-topic.');return;}
    const old=secById(d.id);
    if(!old){out.push(newSection(name,d.kind,d.brief,topics,topicDays));continue;}
    const cur=old.topics[old.idx]; let idx=cur!=null?topics.indexOf(cur):-1;
    if(idx<0) idx=Math.min(old.idx,topics.length);
    if(topics[idx]!==cur) old.topicDay=1;
    Object.assign(old,{name,kind:d.kind,brief:d.brief,topics,topicDays,idx,completed:old.completed.filter(t=>topics.includes(t))});
    if((old.topicDay||1)>daysFor(old,topics[idx])) old.topicDay=daysFor(old,topics[idx]);
    out.push(old);
  }
  state.sections=out; draft=null; saveState(); toast("Sections saved"); go({name:"dash"});
}

/* ---------- settings ---------- */
let modelOpts=[];
function renderSettings(){
  const pv=cfg.provider,P=PROVIDERS[pv],k=cfg.key;
  $("#main").innerHTML='<div class="wrap edit"><h1>Settings</h1><p class="sub">Everything is stored only in this browser.</p>'+
  '<div class="panel"><label for="pv">Question generator</label><select id="pv">'+Object.entries(PROVIDERS).map(([v,o])=>'<option value="'+v+'"'+(pv===v?" selected":"")+">"+o.name+"</option>").join("")+'</select>'+
  '<label for="k">API key</label><input type="text" id="k" autocomplete="off" spellcheck="false" placeholder="'+P.keyHint+'" value="'+esc(k?k.slice(0,8)+"…"+k.slice(-4):"")+'">'+
  '<label for="mdl">Model</label><input type="text" id="mdl" list="mdls" value="'+esc(cfg.model)+'"><datalist id="mdls">'+modelOpts.map(m=>'<option value="'+esc(m)+'">').join("")+"</datalist>"+
  '<p class="muted">Get a key at '+P.keyUrl+(pv==="gemini"?'. It\'s free, no card needed. The free tier has daily limits and Google may use free-tier prompts to improve its products.':". Usage is billed to your account.")+" The key is sent only to the provider's API.</p>"+
  '<div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn primary" data-savekey>Save</button><button class="btn" data-testkey>Test key</button>'+(pv==="gemini"&&k?'<button class="btn" data-models>Load available models</button>':"")+(k?'<button class="btn danger" data-clearkey>Remove key</button>':"")+"</div></div>"+
  '<h2>Backup</h2><div class="panel"><p style="margin-top:0">Progress lives in this browser only. Export a backup regularly, and import it to move to another device or browser.</p>'+
  '<div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" data-export>Export backup</button><label class="btn" style="margin:0;color:var(--text)">Import backup<input type="file" id="imp" accept="application/json" hidden></label><button class="btn danger" data-wipe>'+(armed.wipe?"Click again to erase everything":"Erase all progress")+"</button></div></div></div>";
  $("#pv").addEventListener("change",ev=>{try{localStorage.setItem("deprep:provider",ev.target.value);}catch(e){}modelOpts=[];renderSettings();});
  $("#imp").addEventListener("change",async ev=>{const f=ev.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text());if(!data||!data.state)throw new Error("Not a backup file");await Store.clear();for(const [n,v] of Object.entries(data.items||{}))await Store.set(n,v);await Store.set("state",data.state);location.reload();}catch(e){toast("Import failed: "+e.message);}});
}
function storeKeyInputs(){const pv=cfg.provider,v=$("#k").value.trim(),m=$("#mdl").value.trim();try{if(v&&!v.includes("…"))localStorage.setItem("deprep:key_"+pv,v);if(m)localStorage.setItem("deprep:model_"+pv,m);}catch(e){}}
async function exportBackup(){
  const items=await Store.all(); const st=items.state; delete items.state;
  const blob=new Blob([JSON.stringify({app:"de-interview-prep",exported:new Date().toISOString(),state:st,items})],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="de-interview-prep-backup-"+today()+".json"; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const t=e.target.closest("button,[data-sec]"); if(!t) return;
  const ds=t.dataset;
  if(t.id==="menuBtn"){$("#sidebar").classList.toggle("open");return;}
  if(ds.go){ if(ds.go==="edit") draft=null; go({name:ds.go}); return; }
  if(ds.sec&&!ds.m){ go({name:"sec",id:ds.sec}); return; }
  if("savekey" in ds){storeKeyInputs();toast("Settings saved");renderSettings();return;}
  if("clearkey" in ds){try{localStorage.removeItem("deprep:key_"+cfg.provider);localStorage.removeItem("deprep:apikey");}catch(e){}renderSettings();return;}
  if("testkey" in ds){storeKeyInputs();t.disabled=true;t.textContent="Testing…";ask("Reply with the word OK.").then(()=>toast("Key works")).catch(e=>toast("Key test failed: "+e.message)).finally(()=>renderSettings());return;}
  if("models" in ds){t.disabled=true;listGeminiModels().then(l=>{modelOpts=l;renderSettings();toast(l.length+" models available; pick one in the Model field");}).catch(e=>{toast("Couldn't load models: "+e.message);renderSettings();});return;}
  if("export" in ds){exportBackup();return;}
  if("wipe" in ds){arm("wipe",async()=>{await Store.clear();location.reload();});return;}
  if("rmweak" in ds){ arm("w"+ds.rmweak,()=>{state.weak=state.weak.filter(w=>w.id!==ds.rmweak);saveState();render();}); return; }
  const s=view.name==="sec"?secById(view.id):null; const set=s?sets[setKey(s)]:null;
  if("gen" in ds&&s){ generateSet(s); return; }
  if("regen" in ds&&s&&set){ arm("regen"+s.id,()=>{sets[setKey(s)]=null; generateSet(s);}); return; }
  if("round" in ds&&s){ s.idx=0; s.topicDay=1; s.round++; s.completed=[]; s.bankUsed={}; saveState(); render(); return; }
  if(ds.ans&&set){ const q=set.questions[+ds.ans]; q._open=!q._open; renderSection(); return; }
  if(ds.m&&set){ markQ(s,set,+ds.mi,ds.m); return; }
  if("complete" in ds&&s&&set){ completeSet(s,set); toast("Set completed"); return; }
  if("undo" in ds&&s&&set){ undoComplete(s,set); return; }
  if(view.name==="edit"){
    if(ds.up){readDraft();const i=+ds.up;[draft[i-1],draft[i]]=[draft[i],draft[i-1]];renderEdit();return;}
    if(ds.down){readDraft();const i=+ds.down;[draft[i+1],draft[i]]=[draft[i],draft[i+1]];renderEdit();return;}
    if(ds.del){readDraft();const i=+ds.del,d=draft[i];arm("del"+d.id,()=>{draft.splice(i,1);renderEdit();});if(armed["del"+d.id])renderEdit();return;}
    if(ds.reset){readDraft();const id=ds.reset;arm("reset"+id,()=>{const o=secById(id);if(o){Object.assign(o,{idx:0,topicDay:1,completed:[],dayCount:0,lastDone:null,prevTopic:null,round:1,bankUsed:{}});saveState();toast("Progress reset");}renderEdit();});if(armed["reset"+id])renderEdit();return;}
    if("add" in ds){readDraft();draft.push({id:"new-"+uid(),name:"New section",kind:"theory",brief:true,topics:""});renderEdit();window.scrollTo(0,document.body.scrollHeight);return;}
    if("savedit" in ds){applyDraft();return;}
    if("canceledit" in ds){draft=null;go({name:"dash"});return;}
  }
});

/* ---------- boot ---------- */
(async function boot(){
  await Store.init();
  state=await Store.get("state");
  if(!state||!Array.isArray(state.sections)){ state=defaultState(); saveState(); }
  state.weak=state.weak||[]; state.activity=state.activity||[];
  let mig=false; state.sections.forEach(s=>{ if(!s.topicDays){ s.topicDays={}; if(s.kind==="dsa") s.topics.forEach(t=>{ if(DSA_DAYS[t]) s.topicDays[t]=DSA_DAYS[t]; }); s.topicDay=s.topicDay||1; mig=true; } });
  if(!state.bump2){ state.sections.forEach(s=>{ s.topicDays=s.topicDays||{}; s.topics.forEach(t=>{ s.topicDays[t]=Math.min(30,daysFor(s,t)+2); }); }); state.bump2=true; mig=true; }
  if(mig) saveState();
  try{const v=JSON.parse(localStorage.getItem("deprep:view")||"null"); if(v&&(v.name!=="sec"||secById(v.id))) view=v;}catch(e){}
  if(view.name==="edit") view={name:"dash"};
  if(!cfg.key&&!(await Store.get("seenSettings"))){ view={name:"settings"}; Store.set("seenSettings",true); }
  render();
})();
})();
</script>
</body>
